<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyFlow AI</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<h1>📚 StudyFlow AI</h1>

<p class="subtitle">
Tu organizador inteligente de estudio
</p>



<div class="card">

<h2>📊 Progreso de hoy</h2>

<div class="progress">

<div id="bar"></div>

</div>

<p id="percentage">
0% completado
</p>

</div>



<div class="card">

<h2>🎯 Próxima tarea</h2>

<h3 id="nextTask">
Cargando...
</h3>


<button onclick="finishTask()">
✅ Terminar tarea
</button>


</div>




<div class="card">

<h2>📚 Mis tareas de hoy</h2>

<div id="tasks"></div>


</div>




<div class="card">

<h2>💡 Consejo</h2>

<p id="tip"></p>

</div>



</div>


<script src="script.js"></script>

</body>

</html>
